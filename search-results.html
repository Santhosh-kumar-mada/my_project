<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Results — ChatGPT Prompts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080810;
      --surface: rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --accent: #c8a97e;
      --accent-glow: rgba(200,169,126,0.25);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.5);
      --muted2: rgba(240,237,232,0.28);
      --radius: 20px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; min-height:100vh; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(200,169,126,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 80%, rgba(120,100,180,0.05) 0%, transparent 60%);
      pointer-events:none; z-index:0;
    }
    .container { position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:0 24px; }

    /* ── HEADER ── */
    .header {
      padding:36px 0 28px;
      display:flex; align-items:center; justify-content:space-between;
      gap:20px; flex-wrap:wrap;
    }
    .back-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--glass); border:1px solid var(--glass-border);
      color:var(--muted); text-decoration:none; font-size:0.85rem;
      padding:9px 16px; border-radius:11px; cursor:pointer;
      transition:all 0.2s; backdrop-filter:blur(12px);
    }
    .back-btn:hover { background:var(--surface-hover); border-color:var(--accent); color:var(--accent); }
    .back-btn svg { width:15px; height:15px; }

    .search-again-wrap {
      display:flex; align-items:center;
      background:var(--glass); border:1px solid var(--glass-border);
      border-radius:14px; backdrop-filter:blur(20px);
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .search-again-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
    .search-again-wrap .icon { display:flex; align-items:center; justify-content:center; width:44px; height:44px; color:var(--muted); }
    .search-again-wrap .icon svg { width:17px; height:17px; }
    .search-again-wrap input {
      height:44px; background:transparent; border:none; outline:none;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.92rem;
      padding:0 4px; min-width:200px;
    }
    .search-again-wrap input::placeholder { color:var(--muted2); }
    .search-btn {
      height:44px; background:var(--accent); border:none; color:#1a1200;
      font-family:'Syne',sans-serif; font-weight:700; font-size:0.82rem;
      letter-spacing:0.5px; padding:0 18px; border-radius:0 13px 13px 0;
      cursor:pointer; transition:opacity 0.2s; white-space:nowrap;
    }
    .search-btn:hover { opacity:0.85; }

    /* ── RESULTS META ── */
    .results-meta {
      margin-bottom:28px;
    }
    .results-meta .label { font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px; }
    .results-meta h2 {
      font-family:'Syne',sans-serif; font-size:clamp(1.3rem,3vw,1.9rem); font-weight:800;
      color:var(--text);
    }
    .results-meta h2 mark {
      background: transparent;
      color: var(--accent);
      font-style:italic;
    }
    .results-meta .count { font-size:0.88rem; color:var(--muted); margin-top:6px; }

    .divider {
      height:1px;
      background:linear-gradient(90deg,transparent,var(--glass-border) 30%,var(--glass-border) 70%,transparent);
      margin-bottom:36px;
    }

    /* ── CARDS ── */
    #results-container { display:flex; flex-direction:column; gap:24px; padding-bottom:60px; }

    .prompt-card {
      display:grid; grid-template-columns:420px 1fr;
      background:var(--surface); border:1px solid var(--glass-border);
      border-radius:var(--radius); overflow:hidden;
      transition:border-color 0.25s, box-shadow 0.25s, transform 0.25s;
      opacity:0; transform:translateY(18px);
      animation:cardIn 0.42s ease forwards;
    }
    .prompt-card:hover {
      border-color:rgba(200,169,126,0.3);
      box-shadow:0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(200,169,126,0.12) inset;
      transform:translateY(-2px);
    }
    @keyframes cardIn { to { opacity:1; transform:translateY(0); } }
    .prompt-card:nth-child(1){ animation-delay:0.04s }
    .prompt-card:nth-child(2){ animation-delay:0.09s }
    .prompt-card:nth-child(3){ animation-delay:0.14s }
    .prompt-card:nth-child(4){ animation-delay:0.19s }
    .prompt-card:nth-child(n+5){ animation-delay:0.24s }

    .card-image-wrap { position:relative; overflow:hidden; background:#111118; }
    .card-image-wrap img {
      width:100%; height:100%; object-fit:contain; display:block;
      transition:transform 0.5s ease, opacity 0.4s ease; opacity:0;
    }
    .card-image-wrap img.loaded { opacity:1; }
    .prompt-card:hover .card-image-wrap img { transform:scale(1.03); }
    .card-image-wrap::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      background-size:200% 100%; animation:shimmer 1.8s infinite; z-index:1; pointer-events:none;
    }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

    .card-content {
      display:flex; flex-direction:column; justify-content:space-between;
      padding:30px 32px; gap:14px;
    }
    .card-number { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); font-weight:600; }
    .card-content h2 {
      font-family:'Syne',sans-serif; font-size:clamp(1.1rem,2vw,1.45rem);
      font-weight:700; line-height:1.25; color:var(--text); margin-top:2px;
    }
    /* highlight matched text in title */
    .card-content h2 mark, .card-content p mark {
      background: rgba(200,169,126,0.25);
      color: var(--accent);
      border-radius:3px; padding:0 2px;
    }
    .card-content p {
      font-size:0.875rem; line-height:1.75; color:var(--muted); flex:1;
      display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
    }
    .card-footer {
      display:flex; align-items:center; justify-content:space-between;
      padding-top:18px; border-top:1px solid rgba(255,255,255,0.07); margin-top:auto;
    }
    .copy-btn {
      display:flex; align-items:center; gap:8px;
      background:transparent; border:1px solid var(--glass-border);
      color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.8rem;
      padding:8px 16px; border-radius:10px; cursor:pointer; transition:all 0.2s;
    }
    .copy-btn:hover { background:var(--surface-hover); border-color:var(--accent); color:var(--accent); }
    .copy-btn.copied { background:rgba(200,169,126,0.12); border-color:var(--accent); color:var(--accent); }
    .copy-btn svg { width:14px; height:14px; }
    .card-tag {
      font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--muted2); background:rgba(255,255,255,0.04); padding:5px 10px; border-radius:6px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align:center; padding:80px 20px;
      opacity:0; animation:cardIn 0.4s ease 0.1s forwards;
    }
    .empty-icon { font-size:3rem; margin-bottom:16px; opacity:0.4; }
    .empty-state h3 { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:700; margin-bottom:10px; }
    .empty-state p { color:var(--muted); font-size:0.92rem; }
    .empty-state a {
      display:inline-block; margin-top:24px;
      background:var(--accent); color:#1a1200;
      font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem;
      padding:11px 22px; border-radius:12px; text-decoration:none;
      transition:opacity 0.2s;
    }
    .empty-state a:hover { opacity:0.85; }

    /* ── FOOTER ── */
    .footer {
      position:relative; z-index:1; padding:32px 24px;
      border-top:1px solid var(--glass-border); text-align:center;
      max-width:1160px; margin:0 auto;
    }
    .footer p { font-size:0.8rem; color:var(--muted2); margin-bottom:12px; }
    .instagram {
      display:inline-flex; align-items:center; gap:10px;
      color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:500;
      padding:10px 20px; background:var(--glass); border:1px solid var(--glass-border);
      border-radius:12px; transition:background 0.2s,border-color 0.2s;
    }
    .instagram:hover { background:var(--surface-hover); border-color:rgba(255,255,255,0.2); }
    .instagram img { width:22px; border-radius:6px; }

    @media(max-width:820px){
      .prompt-card { grid-template-columns:1fr; }
      .card-image-wrap { min-height:200px; }
    }
    @media(max-width:560px){
      .header { flex-direction:column; align-items:flex-start; gap:16px; }
      .search-again-wrap input { min-width:130px; }
      .card-content { padding:20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to all prompts
    </a>

    <form class="search-again-wrap" id="search-form" onsubmit="return doSearch()">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="search-input" placeholder="Search prompts…" autocomplete="off">
      <button type="submit" class="search-btn">Search</button>
    </form>
  </header>

  <div id="results-meta" class="results-meta"></div>
  <div class="divider"></div>
  <main id="results-container"></main>
</div>

<div class="footer">
  <p>Crafted with precision — find more on Instagram</p>
  <a href="https://www.instagram.com/santhosh_kumar_mada_2006?igsh=aHdxY2h5MXFsY2Ny" class="instagram">
    <img src="./images/instagram.png" alt="instagram">
    <span>@santhosh_kumar_mada_2006</span>
  </a>
</div>

<script src="data.js"></script>
<script>
  function doSearch() {
    const q = document.getElementById("search-input").value.trim();
    if (q) window.location.href = "search-results.html?q=" + encodeURIComponent(q);
    return false;
  }

  function highlight(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return text.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
  }

  function makeCopyBtn(text) {
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Prompt`;
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add("copied");
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Copied!`;
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Prompt`;
        }, 2000);
      });
    });
    return btn;
  }

  // ── READ QUERY FROM URL ──
  const params = new URLSearchParams(window.location.search);
  const query = (params.get("q") || "").trim();
  const queryLower = query.toLowerCase();

  // Pre-fill search box
  document.getElementById("search-input").value = query;

  const metaEl = document.getElementById("results-meta");
  const resultsEl = document.getElementById("results-container");

  if (!query) {
    window.location.href = "index.html";
  } else {
    const matched = prompts.filter(item =>
      item.title.toLowerCase().includes(queryLower) ||
      item.description.toLowerCase().includes(queryLower)
    );

    // Meta heading
    metaEl.innerHTML = `
      <div class="label">Search results</div>
      <h2>Results for <mark>"${query}"</mark></h2>
      <p class="count">${matched.length} prompt${matched.length !== 1 ? "s" : ""} found</p>
    `;

    if (matched.length === 0) {
      resultsEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>No results found</h3>
          <p>No prompts matched "<strong>${query}</strong>". Try a different keyword.</p>
          <a href="index.html">Browse all prompts</a>
        </div>`;
    } else {
      matched.forEach((item, i) => {
        const idx = prompts.indexOf(item);
        const numMatch = item.title.match(/^(\d+)/);
        const numLabel = numMatch ? String(numMatch[1]).padStart(2, "0") : String(idx + 1).padStart(2, "0");
        const cleanTitle = item.title.replace(/^\d+\.\s*/, "");

        const card = document.createElement("div");
        card.className = "prompt-card";

        // Image
        const imgWrap = document.createElement("div");
        imgWrap.className = "card-image-wrap";
        const img = document.createElement("img");
        img.alt = cleanTitle; img.loading = "lazy"; img.decoding = "async";
        img.addEventListener("load", () => img.classList.add("loaded"));
        img.addEventListener("error", () => img.classList.add("loaded"));
        img.src = item.image;
        imgWrap.appendChild(img);

        // Content
        const content = document.createElement("div");
        content.className = "card-content";
        const topArea = document.createElement("div");
        topArea.innerHTML = `
          <span class="card-number">Prompt ${numLabel}</span>
          <h2>${highlight(cleanTitle, query)}</h2>
          <p>${highlight(item.description, query)}</p>
        `;
        const footer = document.createElement("div");
        footer.className = "card-footer";
        footer.appendChild(makeCopyBtn(item.description));
        const tag = document.createElement("span");
        tag.className = "card-tag"; tag.textContent = "AI Prompt";
        footer.appendChild(tag);
        content.appendChild(topArea);
        content.appendChild(footer);

        card.appendChild(imgWrap);
        card.appendChild(content);
        resultsEl.appendChild(card);
      });
    }
  }
</script>
</body>
</html>
