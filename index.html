<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHATGPT PROMPTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080810;
      --surface: rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --accent: #c8a97e;
      --accent-glow: rgba(200,169,126,0.25);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.5);
      --muted2: rgba(240,237,232,0.28);
      --radius: 20px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(200,169,126,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 80%, rgba(120,100,180,0.05) 0%, transparent 60%);
      pointer-events:none; z-index:0;
    }
    .container { position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:0 24px; }
    .header {
      padding:36px 0 28px;
      display:flex; align-items:center; justify-content:space-between;
      gap:20px; flex-wrap:wrap;
    }
    .brand-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:500; display:block; margin-bottom:4px; }
    .brand h1 {
      font-family:'Syne',sans-serif; font-size:clamp(1.4rem,3.5vw,2.2rem);
      font-weight:800; letter-spacing:-0.5px; line-height:1;
    }
    .search-wrapper { position:relative; }
    .search-box {
      display:flex; align-items:center;
      background:var(--glass); border:1px solid var(--glass-border);
      border-radius:14px; backdrop-filter:blur(20px);
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
    .search-icon { display:flex; align-items:center; justify-content:center; width:44px; height:44px; color:var(--muted); }
    .search-icon svg { width:17px; height:17px; }
    .search-box input {
      height:44px; background:transparent; border:none; outline:none;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.92rem;
      padding:0 16px 0 0; min-width:220px;
    }
    .search-box input::placeholder { color:var(--muted2); }
    .search-results {
      display:none;
      position:absolute; top:calc(100% + 10px); left:0; right:0;
      min-width:340px;
      background:rgba(12,12,20,0.97);
      border:1px solid var(--glass-border);
      border-radius:16px; overflow:hidden; z-index:9999;
      box-shadow:0 24px 60px rgba(0,0,0,0.6);
      backdrop-filter:blur(24px);
    }
    .search-results.visible { display:block; animation: dropIn 0.18s ease; }
    @keyframes dropIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .search-results-header {
      padding:12px 16px 8px;
      font-size:10px; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted2); border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .search-result-item {
      display:flex; align-items:center; gap:14px;
      padding:12px 16px; cursor:pointer;
      border-bottom:1px solid rgba(255,255,255,0.04);
      transition:background 0.15s;
    }
    .search-result-item:last-child { border-bottom:none; }
    .search-result-item:hover { background:rgba(200,169,126,0.1); }
    .search-result-thumb {
      width:40px; height:40px; border-radius:8px; object-fit:cover;
      flex-shrink:0; background:var(--surface);
    }
    .search-result-info { flex:1; overflow:hidden; }
    .search-result-title {
      font-size:0.88rem; font-weight:500; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .search-result-desc {
      font-size:0.75rem; color:var(--muted); margin-top:2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .search-result-arrow { color:var(--muted2); flex-shrink:0; transition:color 0.15s,transform 0.15s; font-size:16px; }
    .search-result-item:hover .search-result-arrow { color:var(--accent); transform:translateX(2px); }
    .search-no-results { padding:24px 16px; text-align:center; color:var(--muted); font-size:0.88rem; }
    .divider {
      height:1px;
      background:linear-gradient(90deg,transparent,var(--glass-border) 30%,var(--glass-border) 70%,transparent);
      margin-bottom:40px;
    }
    #prompt-container { display:flex; flex-direction:column; gap:24px; padding-bottom:60px; }
    .prompt-card {
      display:grid; grid-template-columns:420px 1fr;
      background:var(--surface); border:1px solid var(--glass-border);
      border-radius:var(--radius); overflow:hidden;
      transition:border-color 0.25s, box-shadow 0.25s, transform 0.25s;
      opacity:0; transform:translateY(18px);
      animation:cardIn 0.45s ease forwards;
    }
    .prompt-card:hover {
      border-color:rgba(200,169,126,0.3);
      box-shadow:0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(200,169,126,0.12) inset;
      transform:translateY(-2px);
    }
    @keyframes cardIn { to { opacity:1; transform:translateY(0); } }
    .prompt-card:nth-child(1){ animation-delay:0.05s }
    .prompt-card:nth-child(2){ animation-delay:0.1s }
    .prompt-card:nth-child(3){ animation-delay:0.15s }
    .prompt-card:nth-child(4){ animation-delay:0.2s }
    .prompt-card:nth-child(5){ animation-delay:0.25s }
    .prompt-card:nth-child(n+6){ animation-delay:0.3s }
    .card-image-wrap { position:relative; overflow:hidden; background:#111118; }
    .card-image-wrap img {
      width:100%; height:100%; object-fit:contain; display:block;
      transition:transform 0.5s ease, opacity 0.4s ease;
      opacity:0;
    }
    .card-image-wrap img.loaded { opacity:1; }
    .prompt-card:hover .card-image-wrap img { transform:scale(1.04); }
    .card-image-wrap::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      background-size:200% 100%;
      animation:shimmer 1.8s infinite; z-index:1; pointer-events:none;
    }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .card-content {
      display:flex; flex-direction:column; justify-content:space-between;
      padding:30px 32px; gap:14px;
    }
    .card-number { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); font-weight:600; }
    .card-content h2 {
      font-family:'Syne',sans-serif; font-size:clamp(1.1rem,2vw,1.45rem);
      font-weight:700; line-height:1.25; color:var(--text); margin-top:2px;
    }
    .card-content p {
      font-size:0.875rem; line-height:1.75; color:var(--muted); flex:1;
      display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
    }
    .card-footer {
      display:flex; align-items:center; justify-content:space-between;
      padding-top:18px; border-top:1px solid rgba(255,255,255,0.07);
      margin-top:auto;
    }
    .copy-btn {
      display:flex; align-items:center; gap:8px;
      background:transparent; border:1px solid var(--glass-border);
      color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.8rem;
      padding:8px 16px; border-radius:10px; cursor:pointer;
      transition:all 0.2s;
    }
    .copy-btn:hover { background:var(--surface-hover); border-color:var(--accent); color:var(--accent); }
    .copy-btn.copied { background:rgba(200,169,126,0.12); border-color:var(--accent); color:var(--accent); }
    .copy-btn svg { width:14px; height:14px; }
    .card-tag {
      font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--muted2); background:rgba(255,255,255,0.04); padding:5px 10px; border-radius:6px;
    }
    .prompt-card.highlight {
      border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-glow), 0 20px 50px rgba(0,0,0,0.4);
    }
    .footer {
      position:relative; z-index:1;
      padding:32px 24px; border-top:1px solid var(--glass-border);
      text-align:center; max-width:1160px; margin:0 auto;
    }
    .footer p { font-size:0.8rem; color:var(--muted2); margin-bottom:12px; }
    .instagram {
      display:inline-flex; align-items:center; gap:10px;
      color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:500;
      padding:10px 20px; background:var(--glass); border:1px solid var(--glass-border);
      border-radius:12px; transition:background 0.2s,border-color 0.2s;
    }
    .instagram:hover { background:var(--surface-hover); border-color:rgba(255,255,255,0.2); }
    .instagram img { width:22px; border-radius:6px; }
    @media(max-width:820px){
      .prompt-card { grid-template-columns:1fr; }
      .card-image-wrap { min-height:200px; }
    }
    @media(max-width:560px){
      .header { flex-direction:column; align-items:flex-start; gap:16px; }
      .search-box input { min-width:160px; }
      .search-results { min-width:unset; }
      .card-content { padding:20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand">
      <span class="brand-label">AI Creative Studio</span>
      <h1>ChatGPT Prompts</h1>
    </div>
    <div class="search-wrapper">
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input type="text" placeholder="Search prompts…" id="search-input" autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </header>

  <div class="divider"></div>
  <main id="prompt-container"></main>
</div>

<div class="footer">
  <p>Crafted with precision — find more on Instagram</p>
  <a href="https://www.instagram.com/santhosh_kumar_mada_2006?igsh=aHdxY2h5MXFsY2Ny" class="instagram">
    <img src="./images/instagram.png" alt="instagram">
    <span>@santhosh_kumar_mada_2006</span>
  </a>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
