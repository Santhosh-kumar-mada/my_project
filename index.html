      .hero-heading{

        align-items: center;
        justify-content: space-between;
      }

        height:30px;

        padding-top: 10px;
      }

      }
      .instagram img{
        border-radius: 15px;
      }
      .search-results {
        position: absolute;
        background: rgb(0, 0, 0);
        border: 1px solid #ff0000;
        max-height: 150px;
        overflow-y: auto;
        width: 20%;
        z-index: 100;
        border-radius: 10px;
      }

      .search-results div {
        padding: 8px;
        cursor: pointer;
        border-radius: 5px;
      }

      .search-results div:hover {
        background-color: #f0f0f0;
        color: black;
