<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Santhosh Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0b0b0b;
      --card: #151515;
      --accent: #ff3b3b;
      --text: #ffffff;
      --muted: #bdbdbd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ---------- LAYOUT ---------- */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* ---------- HEADER ---------- */
    .hero-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero-heading {
      position: relative;
      z-index: 10;          /* stays above page content */
    }


    .hero-heading h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 1px;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }
   

    .search-box input {
      width: 260px;
      max-width: 100%;
      height: 40px;
      border-radius: 12px;
      border: none;
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
    }

    .search-box img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* ---------- SEARCH RESULTS ---------- */
    .search-results {
      position: absolute;
      top: calc(100% + 8px);   /* always below input */
      left: 0;
      width: 100%;
      background: #151515;
      border: 1px solid #ff3b3b;
      border-radius: 14px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 9999;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }

    .search-results div {
      padding: 10px;
      cursor: pointer;
    }

    .search-results div:hover {
      background-color: var(--accent);
      color: black;
    }

    /* ---------- PROMPT BLOCK ---------- */
    #prompt-container {
        position: relative;
        z-index: 1;
        margin-top: 40px;
    }

    .prompt-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      background: var(--card);
      padding: 25px;
      border-radius: 16px;
      align-items: center;
    }

    .prompt-block img {
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
    }

    .prompt-block h2 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin-bottom: 10px;
    }

    .prompt-block p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--muted);
    }

    /* ---------- FOOTER ---------- */
    .footer {
      margin-top: 60px;
      padding: 30px 0;
      border-top: 1px solid #333;
      text-align: center;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: white;
      text-decoration: none;
    }

    .instagram img {
      width: 32px;
      border-radius: 10px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .prompt-block {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .search-box {
        width: 100%;
        justify-content: space-between;
      }

      .search-box input {
        width: 100%;
      }
    }
  </style>
</head>
